name: Java Lint and Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and Lint
        run: |
          mkdir -p out
          javac -Xlint:all -d out *.java

      - name: Test HelloWorld
        run: |
          java -cp out HelloWorld | grep "Hello from MERGED branch"

      - name: Test Addition
        run: |
          java -cp out Addition | grep "Sum = 30"